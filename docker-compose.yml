services:
  app:
    image: golang:1.22
    working_dir: /app
    volumes:
      - ./:/app
      - go-mod-cache:/go/pkg/mod
    ports:
      - "8000:8000"
    depends_on:
      - redis
    environment:
      - REDIS_ADDR=redis:6379
    # コンテナは常時生存させ、API サーバも seeder も exec で起動する。
    # こうすると「go run が落ちて exec が is not running になる」事故が原理的に起きない。
    command: sleep infinity

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    # ★実験1の初期状態：永続化を完全オフ（RDBもAOFも無効）
    #   実験1後半で下記をコメントアウトして永続化を有効化していく。
    command: redis-server --save "" --appendonly no
    #command: redis-server --save "60 1000"
    #command: redis-server --appendonly yes --appendfsync everysec
    #command: redis-server --appendonly yes --appendfsync always
    # 実験2 メモリ・データ量の実験
    # メモリ以上の新規書き込みをエラーで弾く
    #command: redis-server --save "" --appendonly no --maxmemory 3mb --maxmemory-policy noeviction
    #command: redis-server --save "" --appendonly no --maxmemory 3mb --maxmemory-policy allkeys-lru

    volumes:
      - redis-data:/data

    # ★実験4（レプリケーション）用のレプリカ。実験1〜3では使わない（無害だが不要）。
    #   redis を primary として複製する。直接覗くときは 6380 ポート。
  redis-replica:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    command: redis-server --replicaof redis 6379 --save "" --appendonly no
    depends_on:
      - redis

volumes:
  redis-data:
  go-mod-cache:
